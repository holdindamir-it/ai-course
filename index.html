<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Автоматизация: Вход в систему</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 10px; font-size: 28px; }
        p { color: #5f6368; margin-bottom: 30px; font-size: 16px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        .toggle-link { margin-top: 20px; color: #1a73e8; cursor: pointer; font-size: 15px; text-decoration: underline; }
        .error-msg { color: #d93025; margin-top: 10px; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="auth-title">Вход в обучение</h2>
    <p id="auth-subtitle">Курс по AI-автоматизации для папы</p>
    
    <input type="email" id="email" placeholder="Электронная почта">
    <input type="password" id="password" placeholder="Пароль (минимум 6 знаков)">
    
    <button id="btn-action">Войти</button>
    <div class="error-msg" id="error-message"></div>
    
    <div class="toggle-link" id="toggle-auth">Нет аккаунта? Зарегистрироваться</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Твоя конфигурация из Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyD0l3Ko-wm3DhDRu2oFk6fxpv-IYLieTjI",
        authDomain: "dadbd-b404c.firebaseapp.com",
        projectId: "dadbd-b404c",
        storageBucket: "dadbd-b404c.firebasestorage.app",
        messagingSenderId: "759709621277",
        appId: "1:759709621277:web:8d1dd7012dc54377a57af4",
        measurementId: "G-BC989QFLTE"
    };

    // Инициализация
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Переменные интерфейса
    let isLoginMode = true;
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnAction = document.getElementById('btn-action');
    const toggleLink = document.getElementById('toggle-auth');
    const title = document.getElementById('auth-title');
    const errorMsg = document.getElementById('error-message');

    // Переключение между Входом и Регистрацией
    toggleLink.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            title.innerText = "Вход в обучение";
            btnAction.innerText = "Войти";
            toggleLink.innerText = "Нет аккаунта? Зарегистрироваться";
        } else {
            title.innerText = "Регистрация";
            btnAction.innerText = "Создать аккаунт";
            toggleLink.innerText = "Уже есть аккаунт? Войти";
        }
        errorMsg.innerText = "";
    });

    // Действие при нажатии на кнопку
    btnAction.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        errorMsg.innerText = "";

        if (!email || !password) {
            errorMsg.innerText = "Заполните все поля";
            return;
        }

        try {
            if (isLoginMode) {
                // Вход
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html"; // Перенаправляем на панель уроков
            } else {
                // Регистрация
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            }
        } catch (error) {
            console.error(error);
            if (error.code === "auth/invalid-credential") {
                errorMsg.innerText = "Неверная почта или пароль.";
            } else if (error.code === "auth/weak-password") {
                errorMsg.innerText = "Пароль должен быть не менее 6 символов.";
            } else if (error.code === "auth/email-already-in-use") {
                errorMsg.innerText = "Эта почта уже используется.";
            } else {
                errorMsg.innerText = "Ошибка: " + error.message;
            }
        }
    });

    // Если папка уже вошел, сразу перекидываем его на уроки
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "dashboard.html";
        }
    });
</script>

</body>
</html>
